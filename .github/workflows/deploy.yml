# Author: Moksh Sharma / DevOps Architecture
# Description: Deploys delta metadata on push / merge to QA, UAT, or Main.

name: Deploy Environment

on:
  push:
    branches: [ qa, uat, main ]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: ms${{ github.ref_name }}
    steps:
      -
        name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      -
        name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      -
        name: Install Salesforce CLI & SDR
        run: |
          npm install -g "@salesforce/cli@${{ vars.SF_CLI_VERSION }}"
          npm install --no-save "@salesforce/source-deploy-retrieve@${{ vars.SDR_VERSION }}"

      -
        name: Authenticate Target Org
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          USERNAME: ${{ vars.USERNAME }}
          INSTANCE_URL: ${{ vars.INSTANCE_URL }}
        run: |
          set -e
          [ -n "$SERVER_KEY" ]   || { echo "::error::Missing SERVER_KEY"; exit 1; }
          [ -n "$CLIENT_ID" ]    || { echo "::error::Missing CLIENT_ID"; exit 1; }
          [ -n "$USERNAME" ]     || { echo "::error::Missing USERNAME"; exit 1; }
          [ -n "$INSTANCE_URL" ] || { echo "::error::Missing INSTANCE_URL"; exit 1; }

          if echo "$SERVER_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SERVER_KEY" > /tmp/server.key
          else
            printf '%s' "$SERVER_KEY" | tr -d '\r\n ' | base64 -d > /tmp/server.key
          fi
          chmod 600 /tmp/server.key

          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file /tmp/server.key \
            --username "$USERNAME" \
            --instance-url "$INSTANCE_URL" \
            --alias TARGET_ORG \
            --set-default

      - name: Calculate Delta Changes
        id: delta
        env:
          PACKAGE_DIR: force-app
          BUILD_REASON: Push
          BEFORE_SHA: ${{ github.event.before }}
          SF_API_VERSION: ${{ vars.SF_API_VERSION }}
          FORCE_FULL: ${{ vars.FORCE_FULL || 'false' }}
        run: node .github/generate-delta.js

      -
        name: Deploy Changes
        if: steps.delta.outputs.SF_HAS_CHANGES == 'true'
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org TARGET_ORG \
            ${{ steps.delta.outputs.SF_TEST_ARGS }} \
            --wait 75

      -
        name: Upload Delta Manifest
        if: steps.delta.outputs.SF_HAS_CHANGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sf-manifest-${{ github.ref_name }}-${{ github.run_id }}
          path: manifest/package.xml
          if-no-files-found: error
          retention-days: 14

      -
        name: No Changes Detected
        if: steps.delta.outputs.SF_HAS_CHANGES == 'false'
        run: echo "No metadata changes detected."
