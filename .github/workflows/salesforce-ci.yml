# Author: Moksh Sharma / DevOps Architecture
# Description: Production-grade GitHub Actions CI/CD Pipeline for Salesforce Delta Deployments via @salesforce/source-deploy-retrieve

name: Salesforce CI/CD

on:
  push:
    branches: [qa, uat, main]
  pull_request:
    branches: [qa, uat, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  pull-requests: read

env:
  NODE_VERSION: ${{ secrets.NODE_VERSION || vars.NODE_VERSION || '20' }}
  SF_CLI_VERSION: ${{ secrets.SF_CLI_VERSION || vars.SF_CLI_VERSION || 'latest' }}
  SDR_VERSION: ${{ secrets.SDR_VERSION || vars.SDR_VERSION || 'latest' }}
  SF_API_VERSION: ${{ secrets.SF_API_VERSION || vars.SF_API_VERSION || '' }}

jobs:
  validate:
    name: Validate Delta
    runs-on: ubuntu-latest
    environment: ms${{ github.base_ref || github.ref_name }}
    outputs:
      SF_TEST_ARGS: ${{ steps.delta.outputs.SF_TEST_ARGS }}
      SF_HAS_CHANGES: ${{ steps.delta.outputs.SF_HAS_CHANGES }}
      SF_USE_MANIFEST: ${{ steps.delta.outputs.SF_USE_MANIFEST }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Salesforce CLI & SDR
        run: |
          CLI_PKG="${SF_CLI_VERSION:+@salesforce/cli@$SF_CLI_VERSION}"
          CLI_PKG="${CLI_PKG:-@salesforce/cli@latest}"
          SDR_PKG="${SDR_VERSION:+@salesforce/source-deploy-retrieve@$SDR_VERSION}"
          SDR_PKG="${SDR_PKG:-@salesforce/source-deploy-retrieve@latest}"
          npm install -g "$CLI_PKG"
          npm install --no-save "$SDR_PKG"

      - name: Resolve Target Branch
        id: env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET="${{ github.base_ref }}"
          else
            TARGET="${{ github.ref_name }}"
          fi
          echo "target_branch=$TARGET" >> $GITHUB_OUTPUT

      - name: Authenticate Salesforce Org (JWT)
        run: |
          if [ -z "$SF_JWT_KEY" ] || [ -z "$SF_CLIENT_ID" ] || [ -z "$SF_USERNAME" ] || [ -z "$SF_INSTANCE_URL" ]; then
            echo "::error::Missing required Salesforce secrets in environment for target org."
            exit 1
          fi

          if echo "$SF_JWT_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SF_JWT_KEY" > /tmp/server.key
          else
            printf '%s' "$SF_JWT_KEY" | tr -d '\r\n ' | base64 -d > /tmp/server.key
          fi
          chmod 600 /tmp/server.key

          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file /tmp/server.key \
            --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" \
            --alias TARGET_ORG --set-default
        env:
          SF_JWT_KEY: ${{ secrets.SERVER_KEY }}
          SF_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SF_USERNAME: ${{ secrets.USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.INSTANCE_URL }}

      - name: Generate Delta Manifest (SDR)
        id: delta
        run: node .github/generate-delta.js
        env:
          PACKAGE_DIR: force-app
          BUILD_REASON: ${{ github.event_name == 'pull_request' && 'PullRequest' || 'Push' }}
          PR_TARGET_BRANCH: ${{ steps.env.outputs.target_branch }}
          BEFORE_SHA: ${{ github.event.before }}
          SF_API_VERSION: ${{ env.SF_API_VERSION }}

      - name: Validate Deployment
        if: steps.delta.outputs.SF_HAS_CHANGES == 'true'
        run: |
          TEST_ARGS="${{ steps.delta.outputs.SF_TEST_ARGS }}"
          if [ "${{ steps.delta.outputs.SF_USE_MANIFEST }}" = "true" ]; then
            sf project deploy validate --manifest manifest/package.xml --target-org TARGET_ORG $TEST_ARGS --wait 120
          else
            sf project deploy validate --source-dir force-app --target-org TARGET_ORG $TEST_ARGS --wait 120
          fi

      - name: Upload Manifest Artifact
        if: steps.delta.outputs.SF_HAS_CHANGES == 'true' && steps.delta.outputs.SF_USE_MANIFEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sf-manifest
          path: manifest/package.xml

  deploy:
    name: Deploy to Environment
    needs: validate
    if: github.event_name == 'push' && needs.validate.outputs.SF_HAS_CHANGES == 'true'
    runs-on: ubuntu-latest
    environment: ms${{ github.ref_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Salesforce CLI
        run: |
          CLI_PKG="${SF_CLI_VERSION:+@salesforce/cli@$SF_CLI_VERSION}"
          CLI_PKG="${CLI_PKG:-@salesforce/cli@latest}"
          npm install -g "$CLI_PKG"

      - name: Download Manifest Artifact
        uses: actions/download-artifact@v4
        with:
          name: sf-manifest
          path: manifest
        continue-on-error: true

      - name: Authenticate Salesforce Org (JWT)
        run: |
          if [ -z "$SF_JWT_KEY" ] || [ -z "$SF_CLIENT_ID" ] || [ -z "$SF_USERNAME" ] || [ -z "$SF_INSTANCE_URL" ]; then
            echo "::error::Missing required Salesforce secrets in environment for target org."
            exit 1
          fi

          if echo "$SF_JWT_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SF_JWT_KEY" > /tmp/server.key
          else
            printf '%s' "$SF_JWT_KEY" | tr -d '\r\n ' | base64 -d > /tmp/server.key
          fi
          chmod 600 /tmp/server.key

          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file /tmp/server.key \
            --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" \
            --alias TARGET_ORG --set-default
        env:
          SF_JWT_KEY: ${{ secrets.SERVER_KEY }}
          SF_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SF_USERNAME: ${{ secrets.USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.INSTANCE_URL }}

      - name: Execute Deployment
        run: |
          TEST_ARGS="${{ needs.validate.outputs.SF_TEST_ARGS }}"
          if [ -f "manifest/package.xml" ]; then
            sf project deploy start --manifest manifest/package.xml --target-org TARGET_ORG $TEST_ARGS --wait 120
          else
            sf project deploy start --source-dir force-app --target-org TARGET_ORG $TEST_ARGS --wait 120
          fi

  backmerge:
    name: Back-Merge Main to UAT & QA
    needs: [validate, deploy]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.validate.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Back-Merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for target in uat qa; do
            if ! git show-ref --quiet --verify "refs/remotes/origin/$target"; then
              echo "Branch origin/$target does not exist, skipping back-merge."
              continue
            fi
            git checkout "$target"
            git pull origin "$target"
            if git merge --no-edit origin/main; then
              git push origin "$target"
              echo "Back-merged main -> $target"
            else
              echo "Back-merge conflict on $target - resolve manually."
              git merge --abort
              exit 1
            fi
          done
